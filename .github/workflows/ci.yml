# CI of this repository: install, lint, type check, test with the coverage
# gate, and build.
#
# Node.js comes from .nvmrc and pnpm from the "packageManager" field in
# package.json, so the versions used here are the ones the repository declares.
# Corepack, which ships with Node.js 24, provides that pnpm version.
#
# The check appears as "Lint, test and build". Add that name to the ruleset of
# the default branch after the first run.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      NUXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # Runs the tests and fails when a file of the measured set has less than
      # 90 % line coverage. The set and the threshold are in vitest.config.ts.
      - name: Test with the coverage gate
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
